# System packages (.deb, .rpm, .apk, Arch) for ASCIIpOrtal, built by nfpm
# from the same static Linux build as the av archive. The release workflow
# sets VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64).
#
# The game looks for /usr/share/asciiportal and, when it exists, reads its
# maps from there (src/ap_filemgr.cpp), so no start script is needed.
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries.
name: asciiportal
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/asciiportal
license: GPL-3.0-only AND MIT AND CC-BY-SA-2.0
description: |
  A 2D puzzle platformer with portals, in the terminal.
  Shoot two linked portals to cross gaps, fling yourself and move boxes.
  ASCIIpOrtal 1.3-beta8 by Joe Larson, terminal version with fixes,
  packaged by Asciiverse.
contents:
  - src: asciiportal
    dst: /usr/bin/asciiportal
    file_info: { mode: 0755 }
  - src: stage/lib/maps
    dst: /usr/share/asciiportal/maps
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/asciiportal/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/asciiportal/README.md
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/asciiportal/PATCHES.md
    file_info: { mode: 0644 }
